aid: crownit
name: CrownIT
description: "CrownIT (Crownit.in) is India's online market-research and consumer-insights platform,
  now acquired by Ipsos, the world's leading market research company. Operating as a full-stack agency,
  Crownit conducts online surveys and tracks purchase and consumption behavior via shopping bills and
  product photos submitted through its mobile app, applying machine learning and big-data analytics to
  deliver fast, accurate and comprehensive consumer insights to over 200 brands and enterprises across
  40+ Indian cities. Backed by Accel and surfaced in the API Evangelist network as a VC-portfolio
  company profile; Crownit runs a consumer rewards and survey application rather than a public developer
  API, so this profile carries company identity only and has no OpenAPI, developer portal, or API
  artifacts."
